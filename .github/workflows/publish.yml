name: Publish Docker Images

on:
  push:
    tags:
      - '[0-9]*'   # 1.0.0、0.2.0
      - 'v[0-9]*'  # v1.0.0
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 允许推送到 ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 后端 ----------
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./yunlan-video-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aifusionvideo-server:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aifusionvideo-server:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------- 前端 ----------
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./yunlan-video-webui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aifusionvideo-webui:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/aifusionvideo-webui:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
