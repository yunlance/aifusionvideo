# ============================================
# 云揽镜 - Docker Compose (本地构建镜像)
# ============================================
# 部署配置: 基于 .env.example 创建 .env，并只修改 .env
# 使用方式: docker compose -f docker-compose.build.yml up -d --build
# ============================================

services:
  # ---------- 基础设施 ----------
  mysql:
    image: mysql:8.0
    container_name: aifusionvideo-mysql
    restart: unless-stopped
    environment:
      TZ: ${APP_TIME_ZONE:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aifusionvideo}
      MYSQL_USER: "${MYSQL_USERNAME:-}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=${MYSQL_SESSION_TIME_ZONE:-+08:00}
    volumes:
      - mysql_data:/var/lib/mysql
    # 映射到宿主机 53306，便于本地开发与图形客户端连接。
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aifusionvideo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    volumes:
      - redis_data:/data
    # 如需从宿主机访问 Redis，取消以下注释：
    # ports:
    #   - "127.0.0.1:46379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 后端 (本地构建) ----------
  backend:
    build:
      context: ./yunlan-video-server
      dockerfile: Dockerfile
    image: yunlan-video-server:local
    container_name: aifusionvideo-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      MYSQL_SESSION_TIME_ZONE: ${MYSQL_SESSION_TIME_ZONE:-+08:00}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aifusionvideo}
      # 兼容旧部署：未配置应用账号时继续使用 root 与 MYSQL_ROOT_PASSWORD。
      MYSQL_USERNAME: "${MYSQL_USERNAME:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-123456}}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      CORS_ALLOWED_ORIGIN_PATTERNS: "${CORS_ALLOWED_ORIGIN_PATTERNS:-*}"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - media_data:/app/data/media
      - agent_workspace_data:/app/data/agent-workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- 数据库初始化已移至后端 ----------
  # 管理员账号与影视演示项目/分镜/镜头由后端启动时的 DataInitializer 幂等写入；
  # 默认 AI 模型/网关由 Flyway 迁移写入。无需独立的 db-init 容器。

  # ---------- 前端 (本地构建) ----------
  frontend:
    build:
      context: ./yunlan-video-webui
      dockerfile: Dockerfile
    image: yunlan-video-webui:local
    container_name: aifusionvideo-frontend
    restart: unless-stopped
    environment:
      # 留空表示由统一入口提供同源 /api；分域部署由覆盖文件传入完整地址。
      PUBLIC_API_URL: "${PUBLIC_API_URL:-}"
    depends_on:
      - backend

  # ---------- Nginx 反向代理 ----------
  nginx:
    image: nginx:alpine
    container_name: aifusionvideo-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5858}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  redis_data:
  media_data:
  agent_workspace_data:
