# 固定 Compose 项目名为 aifusionvideo，避免因文件位于 yunlan-video-server/ 而显示成目录名。
name: aifusionvideo

services:
  mysql:
    image: mysql:8.0
    container_name: aifusionvideo-mysql
    restart: unless-stopped
    ports:
      - "53306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: aifusionvideo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: aifusionvideo-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
